<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3550c8"/>
    <stop offset="1" stop-color="#141c52"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.32" cy="0.25" r="0.75">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect width="512" height="512" rx="112" fill="url(#glow)"/>
<g transform="translate(256 256) scale(0.92) translate(-256 -256)"><g id="drone">
  <!-- arms -->
  <g stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <line x1="256" y1="256" x2="148" y2="148"/>
    <line x1="256" y1="256" x2="364" y2="148"/>
    <line x1="256" y1="256" x2="148" y2="364"/>
    <line x1="256" y1="256" x2="364" y2="364"/>
  </g>
  <!-- rotors: guard ring, spinning-disc tint, blades, hub -->
  <g id="rotor">
    <circle cx="148" cy="148" r="66" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="10"/>
    <ellipse cx="148" cy="148" rx="50" ry="9" fill="#ffffff" transform="rotate(-30 148 148)"/>
    <ellipse cx="148" cy="148" rx="50" ry="9" fill="#ffffff" fill-opacity="0.55" transform="rotate(60 148 148)"/>
    <circle cx="148" cy="148" r="13" fill="#ffffff"/>
    <circle cx="148" cy="148" r="5" fill="#1b2766"/>
  </g>
  <use href="#rotor" transform="translate(216 0)"/>
  <use href="#rotor" transform="translate(0 216)"/>
  <use href="#rotor" transform="translate(216 216)"/>
  <!-- body -->
  <rect x="200" y="200" width="112" height="112" rx="34" fill="#ffffff"/>
  <rect x="216" y="216" width="80" height="80" rx="24" fill="#e7ebfb"/>
  <!-- camera / status light -->
  <circle cx="256" cy="256" r="22" fill="#1b2766"/>
  <circle cx="256" cy="256" r="12" fill="#ffb31a"/>
  <circle cx="251" cy="251" r="4" fill="#ffffff" fill-opacity="0.85"/>
</g></g>
</svg>
